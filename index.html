<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EEE3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pins">
  <title>Pins</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Map of memories"></div>

  <header class="masthead">
    <h1 class="wordmark">Pins</h1>
    <p class="tagline">An atlas of experiences</p>
    <p class="tally num" id="tally"></p>
    <div class="legend num" aria-label="Colour shows when: oldest to newest"><span id="lg-from"></span><i id="lg-ramp"></i><span id="lg-to"></span></div>
    <div class="active-filters" id="active-filters"></div>
  </header>

  <nav class="tools" aria-label="Map tools">
    <button class="tool" id="btn-filter" aria-label="Filter memories" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      <span class="tool-label">Filter</span><span class="badge" id="filter-count" hidden></span>
    </button>
    <button class="tool" id="btn-time" aria-label="Time travel" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
      <span class="tool-label">Time</span>
    </button>
    <button class="tool" id="btn-fit" aria-label="Show all memories">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.2 3.6 5 3.6 8s-1.1 5.8-3.6 8M12 4c-2.5 2.2-3.6 5-3.6 8s1.1 5.8 3.6 8"/></svg>
      <span class="tool-label">World</span>
    </button>
    <button class="tool" id="btn-library" aria-label="Library and sync" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M7.5 18.5h9.5a3.5 3.5 0 0 0 .4-7 5.5 5.5 0 0 0-10.6-1.2A4.2 4.2 0 0 0 7.5 18.5z"/></svg>
      <span class="tool-label">Library</span><span class="badge dot" id="sync-dot" hidden></span>
    </button>
  </nav>

  <div class="bottom" id="bottom">
    <section class="timeline" id="timeline" hidden aria-label="Time travel">
      <button class="play" id="btn-play" aria-label="Replay the years">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
      </button>
      <div class="tl-body">
        <div class="tl-head">
          <p class="eyebrow">Time travel</p>
          <p class="tl-range" id="tl-range"></p>
        </div>
        <div class="tl-track">
          <div class="tl-bars" id="tl-bars"></div>
          <input type="range" id="tl-from" aria-label="From year">
          <input type="range" id="tl-to" aria-label="To year">
        </div>
        <div class="tl-years num" id="tl-years"></div>
      </div>
    </section>

    <section class="strip" id="strip">
      <button class="strip-head" id="strip-toggle" aria-expanded="true">
        <span class="eyebrow">In view</span>
        <span class="strip-count" id="strip-count"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div class="strip-cards" id="strip-cards"></div>
    </section>
  </div>

  <button class="add" id="btn-add" aria-label="Add a memory">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <aside class="sheet filters" id="filters" hidden aria-label="Filters">
    <div class="sheet-head">
      <h2 class="h2">Filter</h2>
      <button class="close" data-close="filters" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="filters-body"></div>
  </aside>

  <aside class="sheet memory" id="memory" hidden aria-label="Memory">
    <button class="close floating" data-close="memory" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body" id="memory-body"></div>
  </aside>

  <aside class="sheet library" id="library" hidden aria-label="Library">
    <div class="sheet-head">
      <h2 class="h2">Library</h2>
      <button class="close" data-close="library" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="library-body"></div>
  </aside>

  <aside class="sheet capture" id="capture" hidden aria-label="Memory editor">
    <div class="sheet-head">
      <h2 class="h2" id="cap-heading">New memory</h2>
      <button class="close" data-close="capture" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <form class="sheet-body cap" id="cap-form" novalidate autocomplete="off">
      <div class="cap-photos" id="cap-photos"></div>
      <input class="cap-title" id="cap-title" placeholder="Title" aria-label="Title" enterkeyhint="next">
      <textarea class="cap-text" id="cap-text" rows="5" aria-label="Text" placeholder="What happened? A blank line starts a new paragraph. Start with “ to make it a quote."></textarea>
      <div class="f-group"><p class="eyebrow">When</p><input class="cap-input" type="date" id="cap-date" aria-label="Date"></div>
      <div class="f-group">
        <p class="eyebrow">Where</p>
        <div class="cap-search">
          <input class="cap-input" type="search" id="cap-q" placeholder="Search a place or address" aria-label="Search a place" enterkeyhint="search">
          <button type="button" class="btn" id="cap-find">Search</button>
          <button type="button" class="btn icon" id="cap-here" aria-label="Use where I am"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
        </div>
        <ul class="c-sugg cap-results" id="cap-results" hidden></ul>
        <div class="cap-mapwrap"><div class="cap-map" id="cap-map"></div><i class="cap-cross" aria-hidden="true"></i></div>
        <p class="f-hint cap-where" id="cap-where"></p>
        <input class="cap-input" id="cap-place" placeholder="Name of the place" aria-label="Name of the place">
        <div class="cap-row"><input class="cap-input" id="cap-city" placeholder="Town or city" aria-label="Town or city"><input class="cap-input" id="cap-country" placeholder="Country" aria-label="Country"></div>
      </div>
      <div class="f-group"><p class="eyebrow">Category</p><div class="chips" id="cap-kind"></div></div>
      <div class="f-group"><p class="eyebrow">Who was there</p><div class="chips" id="cap-with"></div></div>
      <div class="f-group"><p class="eyebrow">Recorded by</p><div class="seg" id="cap-by"></div></div>
      <div class="f-group"><p class="eyebrow">Trip</p><div class="chips" id="cap-trip"></div></div>
      <div class="f-actions"><button class="btn primary" type="submit" id="cap-save">Save</button><button class="btn" type="button" id="cap-delete" hidden>Delete</button></div>
    </form>
  </aside>

  <section class="page countries" id="countries" hidden aria-label="Countries">
    <header class="page-head">
      <div>
        <p class="eyebrow">Atlas</p>
        <h2 class="h2">Countries</h2>
        <p class="c-count num" id="c-count"></p>
      </div>
      <button class="btn" id="c-mark" aria-pressed="false">Mark visited</button>
      <button class="close" id="c-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="c-map" id="cmap"></div>
    <p class="c-info" id="c-info"></p>
    <div class="c-add">
      <input id="c-q" type="search" placeholder="Add a country by name" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Add a country by name" aria-controls="c-sugg">
      <ul class="c-sugg" id="c-sugg" hidden></ul>
    </div>
    <ul class="c-list" id="c-list"></ul>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/markercluster.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
